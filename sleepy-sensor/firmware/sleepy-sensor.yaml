substitutions:
  name: sleepy-sensor
  friendly_name: "Sleepy Sensor v1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# v1 验证阶段不深睡,常醒方便调试;省电版后面再加 deep_sleep
logger:
  hardware_uart: USB_SERIAL_JTAG   # 原生 USB,无外置串口芯片

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

# GPIO3 拉高 → 2N7002 导通 → 接通 100k/100k 分压(只在测量时耗电)
output:
  - platform: gpio
    pin: GPIO3
    id: bat_divider_gate

sensor:
  - platform: adc
    pin: GPIO4
    name: "Battery Voltage"
    id: bat_voltage
    attenuation: 12db
    update_interval: never   # 由下面 interval 开分压后主动触发
    filters:
      - multiply: 2.0        # 100k/100k 分压还原
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# 每 60s:开分压 → 等稳定 → 采样 → 关分压,电池零漏电
interval:
  - interval: 60s
    then:
      - output.turn_on: bat_divider_gate
      - delay: 100ms
      - component.update: bat_voltage
      - output.turn_off: bat_divider_gate
