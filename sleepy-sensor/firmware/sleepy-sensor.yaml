substitutions:
  name: sleepy-sensor
  friendly_name: "Sleepy Sensor v1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# v1 验证阶段不深睡,常醒方便调试;省电版后面再加 deep_sleep
logger:
  hardware_uart: USB_SERIAL_JTAG   # 原生 USB,无外置串口芯片

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # v1 验证期不省电:modem-sleep 会让 mDNS/API 长连接时断时续,HA 显示不可用
  # 以后上 deep_sleep 省电时再权衡
  power_save_mode: none
  # 砍 WiFi 发射电流尖峰防欠压:信号 -30dBm 余量巨大,降功率纯赚
  # (电池电压低时 HT7833 压差余量小,345mA TX 尖峰会把 3V3 拉进欠压区)
  output_power: 8.5dB
  ap:
    ssid: "${name} fallback"

captive_portal:

# v1 实际电路:BAT+ —R4 1M— IO4(ADC) —R5 1M— GND,常通分压(漏电~2µA)
# 没有 MOS 门控(那是 v2 设计),直接周期采样即可
sensor:
  - platform: adc
    pin: GPIO4
    name: "Battery Voltage"
    id: bat_voltage
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0        # 1M/1M 分压还原
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
